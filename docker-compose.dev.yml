services:
  postgres:
    image: postgres:16-alpine
    container_name: icrm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: icrm
      POSTGRES_PASSWORD: icrm_dev
      POSTGRES_DB: icrm_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icrm -d icrm_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: icrm_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
